# filepath: k8s/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
  labels:
    app: fraud-detection
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-api-secret
  namespace: fraud-detection
type: Opaque
stringData:
  API_KEY: "change-me-in-production"
  DATABASE_URL: "postgresql://fraud_user:fraud_pass@postgres:5432/fraud_db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-config
  namespace: fraud-detection
data:
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  CORS_ORIGINS: "*"
  MODEL_VERSION: "1.0.0"